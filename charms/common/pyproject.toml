[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "jinja2 == 3.1.6",
  "ops == 3.8.1",
]

[project.optional-dependencies]
test = [
  "coverage",
  "flake8",
  "ops[testing]",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
