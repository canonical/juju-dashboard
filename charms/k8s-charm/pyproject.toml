[project]
name = "juju-dashboard-k8s"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = []
dependencies = [
  "ops == 3.8.1",
  "pydantic == 2.13.4",
  "common"
]

[dependency-groups]
dev = [
  "coverage",
  "flake8",
  "ops[testing]",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
common = {path = "common", editable = true}
