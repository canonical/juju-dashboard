package_update: true
package_upgrade: true

packages:
  - python3-jinja2
  - avahi-daemon
  - avahi-autoipd
  - make

snap:
  commands:
    - snap install --classic concierge
    - snap install go --classic
    - snap install yq
    - snap install docker
    - snap install terraform --classic
    - snap install vault
    - snap install jaas --channel 3/edge

write_files:
  - path: "/etc/update-motd.d/99-welcome"
    permissions: "0755"
    content: |
      #!/bin/sh

      HOSTNAME=$(hostname)
      FQDN=$(hostname).local
      echo "======================================================================"
      echo " Port forwards required to access the dashboard:"
      echo "   cat ~/.ssh/id_*.pub | multipass exec $HOSTNAME -- tee -a .ssh/authorized_keys"
      echo "   ssh -A -L :8082:$FQDN:8082 -L :443:$FQDN:443 -L :17070:$FQDN:17070 ubuntu@$FQDN"
      echo
      echo " View Juju Dashboard at:"
      echo "   http://$FQDN:8036"
      echo
      echo " Log in to Juju Dashboard with:"
      echo "   Username: jimm-test"
      echo "   Password: password"
      echo
      echo " Log in to the Juju controller with:"
      echo "   Username: admin"
      echo "   Password: password"
      echo
      echo " Log in to the JIMM controller with:"
      echo "   juju login jimm.localhost -c jimm-dev"
      echo "   Username: jimm-test"
      echo "   Password: password"
      echo
      echo " The Juju Dashboard dev server can be stopped with:"
      echo "   sudo systemctl stop juju-dashboard.service"
      echo " Disable the service with:"
      echo "   sudo systemctl disable juju-dashboard.service"
      echo "======================================================================"

runcmd:
  - |
    # Disable IPv6
    echo "net.ipv6.conf.all.disable_ipv6=1" | sudo tee -a /etc/sysctl.conf
    echo "net.ipv6.conf.default.disable_ipv6=1" | sudo tee -a /etc/sysctl.conf
    echo "net.ipv6.conf.lo.disable_ipv6=1" | sudo tee -a /etc/sysctl.conf
    sudo sysctl -p

  - |
    # Finish Docker setup.
    sudo addgroup --system docker
    sudo adduser ubuntu docker
    sudo snap disable docker
    sudo snap enable docker

  - |
    sudo -u ubuntu sudo concierge prepare -p microk8s --juju-channel 3.6/stable

  - |
    # Fetch Juju Dashboard and run the setup script.
    cd /home/ubuntu/
    # TODO: remove
    sudo -u ubuntu git clone -o upstream https://github.com/huwshimi/juju-dashboard.git
    sudo -u ubuntu git config --global --add safe.directory /home/ubuntu/juju-dashboard
    cd ./juju-dashboard/scripts
    sudo -u ubuntu git checkout cloud-init-jimm-charms
    chmod +x cloud-init-jimm-charms.sh
    su -c '/home/ubuntu/juju-dashboard/scripts/cloud-init-jimm-charms.sh' - ubuntu

final_message: "The system is finally up, after $UPTIME seconds"
