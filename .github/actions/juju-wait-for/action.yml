name: Juju Wait For
description: Wait for a Juju application, unit or model to reach a specific state.
inputs:
  type:
    description: "The type of resource to wait for"
    required: true
  name:
    description: "The name of the resource to wait for"
    required: true
  timeout_minutes:
    description: "Timeout duration in minutes"
    required: false
    default: "5"
  status:
    description: "Expected status for polling. Comma-separated for multiple statuses."
    required: false
    default: "active"

runs:
  using: composite
  steps:
    - name: Wait for Juju resource
      shell: bash
      run: |
        export TYPE='${INPUTS_TYPE}'
        export NAME='${INPUTS_NAME}'
        export TIMEOUT_MINUTES='${INPUTS_TIMEOUT_MINUTES}'
        export EXPECTED_STATUS='${INPUTS_STATUS}'
        ./scripts/wait-for
      env:
        INPUTS_TYPE: ${{ inputs.type }}
        INPUTS_NAME: ${{ inputs.name }}
        INPUTS_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        INPUTS_STATUS: ${{ inputs.status }}
