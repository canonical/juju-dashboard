name: Failure log
description: Output logs if the workflow fails.
inputs:
  juju-env:
    description: The type of Juju environment.
    required: true
  controller:
    description: The bootstrapped controller
    required: true

runs:
  using: composite
  steps:
    - name: Common logs
      shell: bash
      run: |
        echo "-------------------------------------"
        echo "Juju controllers"
        echo "-------------------------------------"
        juju controllers
        echo "-------------------------------------"
        echo "Juju models"
        echo "-------------------------------------"
        juju models
        echo "-------------------------------------"
        echo "Disk space"
        echo "-------------------------------------"
        df -h
        echo "-------------------------------------"
        echo "RAM"
        echo "-------------------------------------"
        free -m
    - name: Juju logs
      if: ${{ inputs.juju-env == 'juju' }}
      shell: bash
      run: |
        echo "-------------------------------------"
        echo "Juju debug-log"
        echo "-------------------------------------"
        juju debug-log -m "${INPUTS_CONTROLLER}":controller --limit 200 --no-tail
      env:
        INPUTS_CONTROLLER: ${{ inputs.controller }}
    - name: JIMM logs
      if: ${{ inputs.juju-env == 'jimm' }}
      shell: bash
      run: |
        echo "-------------------------------------"
        echo "IAM status"
        echo "-------------------------------------"
        juju status -m iam || true
        echo "-------------------------------------"
        echo "IAM core status"
        echo "-------------------------------------"
        juju status -m core || true
        echo "-------------------------------------"
        echo "JIMM status"
        echo "-------------------------------------"
        juju status -m "${INPUTS_CONTROLLER}":jimm || true
        echo "-------------------------------------"
        echo "JIMM debug-log"
        echo "-------------------------------------"
        juju debug-log -m jimm --limit 200 --no-tail
      env:
        INPUTS_CONTROLLER: ${{ inputs.controller }}
