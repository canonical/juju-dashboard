name: Test Charms
on:
  push:
    paths:
      - "charms/**"
  pull_request:
    paths:
      - "charms/**"

permissions: {}

jobs:
  test-charm:
    name: Test ${{ matrix.charm-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        charm-type: [machine-charm, k8s-charm, common]
    defaults:
      run:
        working-directory: "charms/${{ matrix.charm-type }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install requirements
        run: |
          pip install uv
          uv sync
      - name: Run tests
        run: ./run_tests
