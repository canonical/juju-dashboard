name: "E2E tests: Juju, k8s charm and local auth"

on:
  workflow_call:
    inputs:
      admin-password:
        required: false
        type: string
        description: The password to use when logging in as the admin user.
        default: password1
      juju-channel:
        required: false
        type: string
        description: Charm channel of Juju to use.
      send-notification:
        required: false
        type: boolean
        description: Whether to send a notification on failure.
        default: true
    secrets:
      webbot-url:
        required: true

permissions: {}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout Juju Dashboard repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure action
        id: config
        uses: ./.github/actions/prepare-action
      - name: Setup Juju controller on k8s
        uses: charmed-kubernetes/actions-operator@d8217ad61c15f746727a9d41563c13e9b9fe56e3 # main
        with:
          provider: "microk8s"
          channel: 1.36-strict/stable
          juju-channel: ${{ inputs.juju-channel || steps.config.outputs.juju-channel }}
          microk8s-group: snap_microk8s
      - name: Save microk8s controller name
        id: microk8s-controller
        run: echo "name=$CONTROLLER_NAME" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Set up access
        run: echo "${INPUTS_ADMIN_PASSWORD}" | juju change-user-password --no-prompt
        env:
          INPUTS_ADMIN_PASSWORD: ${{ inputs.admin-password }}
      - name: Compute Juju version for test identifier
        id: juju-version
        run: |
          VERSION=$(echo "$CHANNEL" | cut -d'/' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          CHANNEL: ${{ inputs.juju-channel || steps.config.outputs.juju-channel }}
      - name: Set up Juju Dashboard k8s charm
        uses: ./.github/actions/setup-k8s-charm
        with:
          dashboard-ref: ${{ steps.config.outputs.repo-ref }}
          dashboard-resource: ${{ steps.config.outputs.k8s-dashboard-resource }}
          charm-channel: ${{ steps.config.outputs.dashboard-charm-channel }}
      - name: Run tests
        uses: ./.github/actions/run-playwright
        with:
          test-identifier: e2e-juju-${{ steps.juju-version.outputs.version }}-k8s-charm-local-auth
        env:
          CONTROLLER_NAME: ${{ steps.microk8s-controller.outputs.name }}
          AUTH_MODE: local
          JUJU_ENV: juju
          PROVIDER: microk8s
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ inputs.admin-password }}
      - name: Display logs
        if: failure()
        uses: ./.github/actions/failure-log
        with:
          juju-env: "juju"
          controller: ${{ steps.microk8s-controller.outputs.name }}
      - name: Send notification on failure
        if: inputs.send-notification && steps.config.outputs.send-failure-notification && failure()
        uses: ./.github/actions/send-notification
        with:
          webhook-url: ${{ secrets.webbot-url }}
